# Version en ligne de la carte (GitHub Pages) : la page, les données et les tuiles, sans serveur.
# Sans serveur local, la page propose d'ouvrir le fichier .save (lu dans le navigateur, voir public/app.js).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir _site
          cp -r public/. _site/
          cp -r data tiles _site/
          cp docs/images/social-preview.png _site/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
